# Entrega 2: levantar la API con Docker Compose.
#   docker compose up --build
services:
  api:
    build: .
    ports:
      - "8000:8000"
    # Docker le pregunta a /health si la API esta sana (no solo prendida).
    # Se usa python porque la imagen slim no trae curl.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
